# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      python-version: "3.12"
      # The [lake] extra installs the pinned shared lake runtime (data-lake-core), so the
      # Bronze/Silver lake tests run here instead of skipping.
      install-command: uv pip install -e ".[lake]" "pytest==9.1.1"
      # Same checks as the previous workflow: free-only guards, lake runtime importable,
      # tests (-rs keeps any skips visible), compile and CLI smoke.
      test-command: |
        export FREE_ONLY=true ALLOW_PAID_PROVIDERS=false ALLOW_EXTERNAL_WRITES=false
        python -c "import data_lake.product_adapter, data_lake.silver"
        python -m pytest -q -rs
        python -m compileall -q src
        python -m book_seo.ingest --help
        book-seo-data --help

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
