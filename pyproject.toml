[project]
name = "book-seo-data"
version = "0.1.0"
description = "SEO ranking and search intelligence data ingestion."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "python-dotenv>=1.0"]

[project.optional-dependencies]
# Shared lake-first runtime (landing, Bronze Parquet, Silver, DuckDB reads).
# Pinned to an exact commit so CI runs the lake tests reproducibly.
lake = [
  "duckdb>=1.1.0,<2.0.0",
  "pyarrow>=14.0.0,<24.0.0",
  "solo-empire-data-lake[lake] @ https://github.com/bookchaowalit/data-lake-core/archive/b8f8698995a4d4283247bd432d521b337ef8ec94.tar.gz",
]

[project.scripts]
book-seo-data = "book_seo.ingest:main"
book-seo-data-api = "book_seo.api:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
# Pin the classic default rule set explicitly so newer ruff releases (0.16+
# widened the defaults) do not change what CI enforces.
select = ["E4", "E7", "E9", "F"]
