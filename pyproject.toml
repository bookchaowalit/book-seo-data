[project]
name = "book-seo-data"
version = "0.1.0"
description = "SEO ranking and search intelligence data ingestion."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "python-dotenv>=1.0"]

[project.scripts]
book-seo-data = "book_seo.ingest:main"
book-seo-data-api = "book_seo.api:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
